<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- rel="manifest" é injetado por rota via SEOHead (react-helmet-async) —
         não fixar aqui, para o /cardapio poder usar o seu próprio manifest
         (start_url/scope isolados) sem ficarem dois links em conflito
         (o browser só respeita o primeiro em tree order). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#16181d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>100PRESSÃO · Draft House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      Dados estruturados (schema.org) — site-wide, por isso ficam estáticos
      aqui em vez de por rota via Helmet. Morada e telefone confirmados em
      src/pages/Contacto.jsx (2026-07-12). Horário usa o fallback de
      src/lib/horario.js — o horário real é editável no /admin e pode
      divergir deste JSON-LD; atualizar aqui manualmente se mudar de forma
      permanente (não é lido do Supabase em build-time).

      @type mudou de BarOrPub para Restaurant (2026-08-15): a casa serve
      pequeno-almoço, almoço PF e petiscos, não só bebida. Restaurant é o tipo
      que o Google usa para os rich results de restauração (horário, ementa,
      preço) e é o que melhor corresponde à realidade do negócio.

      FALTA (só o Leandro consegue confirmar):
        - "geo": lat/long exatos da loja. Copiar do Google Business Profile.
          Deixado de fora de propósito — coordenadas erradas fazem mais mal do
          que a ausência delas nas buscas locais.
        - "sameAs": URLs finais do Instagram / Facebook / Google Business.
        - "geo" e "sameAs" continuam por preencher (ver acima).
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "additionalType": "https://schema.org/BarOrPub",
        "name": "100PRESSÃO",
        "alternateName": ["100 Pressão", "100PRESSÃO Draft House", "100 Pressao Carnaxide"],
        "description": "Cervejaria artesanal e petiscos luso-brasileiros no Mercado Municipal de Carnaxide, Oeiras.",
        "@id": "https://www.100pressao.pt/#restaurante",
        "url": "https://www.100pressao.pt",
        "telephone": "+351935995011",
        "email": "geral@100pressao.pt",
        "priceRange": "€€",
        "image": [
          "https://www.100pressao.pt/og-image.jpg",
          "https://www.100pressao.pt/og-100pressao.png"
        ],
        "logo": "https://www.100pressao.pt/icon-512.png",
        "hasMap": "https://www.google.com/maps/place//data=!4m2!3m1!1s0xd1ecc607dc2c889:0x1946af38520f51d0",
        "hasMenu": "https://www.100pressao.pt/cardapio",
        "acceptsReservations": "False",
        "currenciesAccepted": "EUR",
        "paymentAccepted": "Dinheiro, Multibanco, MB WAY, Cartão de crédito",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Praceta Eugénio de Castro, Loja 6",
          "addressLocality": "Carnaxide",
          "postalCode": "2790-072",
          "addressRegion": "Oeiras",
          "addressCountry": "PT"
        },
        "areaServed": [
          { "@type": "City", "name": "Carnaxide" },
          { "@type": "City", "name": "Oeiras" },
          { "@type": "City", "name": "Linda-a-Velha" },
          { "@type": "City", "name": "Algés" },
          { "@type": "City", "name": "Queijas" }
        ],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
            ],
            "opens": "08:00",
            "closes": "22:00"
          }
        ],
        "servesCuisine": ["Portuguesa", "Brasileira", "Petiscos", "Cerveja artesanal"],
        "potentialAction": {
          "@type": "OrderAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.100pressao.pt/restaurante",
            "actionPlatform": [
              "https://schema.org/DesktopWebPlatform",
              "https://schema.org/MobileWebPlatform"
            ]
          },
          "deliveryMethod": [
            "https://schema.org/OnSitePickup",
            "https://schema.org/ParcelService"
          ]
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.100pressao.pt/#website",
        "url": "https://www.100pressao.pt",
        "name": "100PRESSÃO",
        "inLanguage": "pt-PT",
        "publisher": { "@id": "https://www.100pressao.pt/#restaurante" }
      }
    </script>
    <!--
      Google Analytics 4 com Consent Mode v2 (RGPD/ePrivacy) — o script
      pode carregar sempre, mas arranca com tudo "denied": não grava
      cookies de identificação enquanto o visitante não aceitar no banner
      (ver src/components/ConsentBanner.jsx e src/lib/analytics.js).
      send_page_view desligado porque é uma SPA — o Layout.jsx envia
      page_view manualmente a cada mudança de rota.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KLXQVNJZ5H"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-KLXQVNJZ5H', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
